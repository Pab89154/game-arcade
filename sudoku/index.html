<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku — Game Arcade</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      .sudoku-grid {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 2px;
        width: min(100%, 360px);
        background: var(--panel-dark);
        border: 2px solid var(--ocean);
        border-radius: var(--radius);
        padding: 3px;
      }
      .cell {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(0.85rem, 3vw, 1.2rem);
        font-weight: 700;
        background: var(--surface);
        border: none;
        cursor: pointer;
        font-family: inherit;
        color: var(--ocean);
      }
      .cell.given { background: var(--surface-hover); color: var(--text-muted); cursor: default; }
      .cell.selected { background: rgba(0, 217, 255, 0.15); box-shadow: inset 0 0 0 2px var(--neon-blue); }
      .cell.wrong { color: var(--neon-pink); background: rgba(255, 45, 170, 0.15); }
      .cell:nth-child(3n) { border-right: 2px solid var(--neon-purple); }
      .cell:nth-child(n+19):nth-child(-n+27),
      .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--neon-purple); }
      .numpad {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 0.4rem;
        width: min(100%, 320px);
      }
      .numpad button {
        padding: 0.6rem;
        border: 2px solid var(--ocean);
        border-radius: var(--radius);
        background: var(--surface);
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        color: var(--text);
      }
      .numpad button:hover { background: var(--surface-hover); }
      .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main" style="max-width: 420px">
        <a class="back-link" href="../index.html">← Back to Arcade</a>
        <header class="header">
          <div class="game-card-icon">🔢</div>
          <h1>Sudoku</h1>
        </header>
        <div class="game-panel">
          <p class="status" id="status">Fill every row, column, and box with 1–9</p>
          <div class="sudoku-grid" id="grid"></div>
          <div class="numpad" id="numpad"></div>
          <div class="actions">
            <button class="btn" id="checkBtn" type="button">Check</button>
            <button class="btn btn-secondary" id="hintBtn" type="button">Hint</button>
            <button class="btn btn-secondary" id="newBtn" type="button">New puzzle</button>
          </div>
        </div>
      </main>
    </div>
    <script src="game.js"></script>
    <script src="../shared.js"></script>
  </body>
</html>
