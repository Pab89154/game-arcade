<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake — Game Arcade</title>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      canvas {
        border: 3px solid var(--ocean);
        border-radius: var(--radius);
        background: var(--panel-dark);
        display: block;
        max-width: 100%;
        touch-action: none;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 56px);
        grid-template-rows: repeat(2, 56px);
        gap: 0.35rem;
        margin-top: 0.5rem;
      }

      .controls button {
        background: var(--surface);
        border: 2px solid var(--neon-blue);
        border-radius: var(--radius);
        font-size: 1.25rem;
        cursor: pointer;
        font-family: inherit;
        color: var(--text);
      }

      .controls button:active {
        background: var(--surface-hover);
      }

      .controls .up { grid-column: 2; }
      .controls .left { grid-column: 1; grid-row: 2; }
      .controls .down { grid-column: 2; grid-row: 2; }
      .controls .right { grid-column: 3; grid-row: 2; }

      .hint {
        color: var(--text-muted);
        font-size: 0.9rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="main">
        <a class="back-link" href="../index.html">← Back to Arcade</a>

        <header class="header">
          <div class="game-card-icon" aria-hidden="true">🐍</div>
          <h1>Snake</h1>
        </header>

        <div class="game-panel">
          <div class="score-bar">
            <div>Score: <span id="score">0</span></div>
          </div>
          <p class="status" id="status">Press Start or arrow keys to play</p>
          <canvas id="canvas" width="400" height="400" aria-label="Snake game board"></canvas>
          <div class="controls" aria-label="On-screen direction controls">
            <button class="up" type="button" data-dir="up">↑</button>
            <button class="left" type="button" data-dir="left">←</button>
            <button class="down" type="button" data-dir="down">↓</button>
            <button class="right" type="button" data-dir="right">→</button>
          </div>
          <p class="hint">Use arrow keys or the buttons above</p>
          <button class="btn btn-secondary" id="startBtn" type="button">Start</button>
        </div>
      </main>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("startBtn");

      const GRID = 20;
      const CELL = canvas.width / GRID;

      let snake, direction, nextDirection, food, score, running, loopId;

      const COLORS = {
        snake: "#39FF14",
        snakeHead: "#00D9FF",
        food: "#FF2DAA",
        grid: "rgba(255,255,255,0.06)",
      };

      function borderDistance(x, y) {
        return Math.min(x, GRID - 1 - x, y, GRID - 1 - y);
      }

      function isNearBorder(x, y) {
        return borderDistance(x, y) === 1;
      }

      function isMiddle(x, y) {
        return borderDistance(x, y) >= 2;
      }

      function randFoodCell() {
        const pickMiddle = Math.random() < 0.5;
        let spot;
        do {
          spot = {
            x: Math.floor(Math.random() * GRID),
            y: Math.floor(Math.random() * GRID),
          };
        } while (pickMiddle ? !isMiddle(spot.x, spot.y) : !isNearBorder(spot.x, spot.y));
        return spot;
      }

      function spawnFood() {
        let spot;
        let tries = 0;
        do {
          spot = randFoodCell();
          tries++;
        } while (snake.some((s) => s.x === spot.x && s.y === spot.y) && tries < 200);
        food = spot;
      }

      function reset() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        scoreEl.textContent = "0";
        spawnFood();
      }

      function draw() {
        ctx.fillStyle = "#060912";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i <= GRID; i++) {
          ctx.strokeStyle = COLORS.grid;
          ctx.beginPath();
          ctx.moveTo(i * CELL, 0);
          ctx.lineTo(i * CELL, canvas.height);
          ctx.moveTo(0, i * CELL);
          ctx.lineTo(canvas.width, i * CELL);
          ctx.stroke();
        }

        ctx.fillStyle = COLORS.food;
        ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

        snake.forEach((seg, i) => {
          ctx.fillStyle = i === 0 ? COLORS.snakeHead : COLORS.snake;
          ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
        });
      }

      function tick() {
        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };

        if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
          gameOver();
          return;
        }

        if (snake.some((s) => s.x === head.x && s.y === head.y)) {
          gameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score++;
          scoreEl.textContent = score;
          spawnFood();
        } else {
          snake.pop();
        }

        draw();
      }

      function gameOver() {
        running = false;
        clearInterval(loopId);
        statusEl.textContent = "Game over! Score: " + score;
        startBtn.textContent = "Restart";
      }

      function startGame(dx, dy) {
        if (running) return;
        reset();
        if (dx !== undefined && dy !== undefined) {
          direction = { x: dx, y: dy };
          nextDirection = { x: dx, y: dy };
        }
        running = true;
        statusEl.textContent = "Go!";
        startBtn.textContent = "Restart";
        draw();
        loopId = setInterval(tick, 180);
      }

      function setDirection(x, y) {
        if (!running) return;
        if (direction.x + x === 0 && direction.y + y === 0) return;
        nextDirection = { x, y };
      }

      function handleTurn(x, y) {
        if (!running) startGame(x, y);
        else setDirection(x, y);
      }

      document.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key === "ArrowUp") { e.preventDefault(); handleTurn(0, -1); }
        else if (key === "ArrowDown") { e.preventDefault(); handleTurn(0, 1); }
        else if (key === "ArrowLeft") { e.preventDefault(); handleTurn(-1, 0); }
        else if (key === "ArrowRight") { e.preventDefault(); handleTurn(1, 0); }
        else if (key === " " && !running) startGame();
      });

      document.querySelectorAll(".controls button").forEach((btn) => {
        btn.addEventListener("click", () => {
          const dir = btn.dataset.dir;
          if (dir === "up") handleTurn(0, -1);
          else if (dir === "down") handleTurn(0, 1);
          else if (dir === "left") handleTurn(-1, 0);
          else if (dir === "right") handleTurn(1, 0);
        });
      });

      startBtn.addEventListener("click", () => {
        if (running) {
          clearInterval(loopId);
          running = false;
        }
        startGame();
      });

      reset();
      draw();
    </script>
    <script src="../shared.js"></script>
  </body>
</html>
